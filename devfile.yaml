schemaVersion: 2.2.0
metadata:
  name: mammoth-ear
  version: 1.0.0
  description: Java EE 8 mammoth facts application with PostgreSQL backend and JSF frontend
attributes:
  .vscode/settings.json: |
    {
      "java.server.launchMode": "Standard",
      "java.configuration.updateBuildConfiguration": "automatic",
      "mta-core.genai.agentMode": true
    }
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 6Gi
      memoryRequest: 2Gi
      cpuLimit: '4'
      cpuRequest: '1'
      mountSources: true
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      env:
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-11-openjdk
        - name: JAVA_TOOL_OPTIONS
          value: '-Djavax.net.ssl.trustStore=/etc/pki/ca-trust/extracted/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit'
        - name: DEFAULT_EXTENSIONS
          value: /tmp/extensions/redhat.mta-vscode-extension.vsix
        - name: FORCE_HUB_ENABLED
          value: 'true'
        - name: HUB_URL
          value: 'https://mta-openshift-mta.apps.cluster-bk7k2.dyn.redhatworkshops.io'
        - name: HUB_PROFILE_SYNC_ENABLED
          value: 'true'
        - name: HUB_SOLUTION_SERVER_ENABLED
          value: 'true'

  - name: eap
    container:
      image: registry.redhat.io/jboss-eap-8/eap81-openjdk21-builder-openshift-rhel9:latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
      sourceMapping: /projects
      command: ['tail']
      args: ['-f', '/dev/null']
      endpoints:
        - name: eap-http
          targetPort: 8180
          exposure: public
          protocol: http
        - name: eap-admin
          targetPort: 10090
          exposure: internal
      env:
        - name: MAMMOTH_API_URL
          value: http://localhost:8180/backend/api/mammoths
        - name: JBOSS_NODE_NAME
          value: mammoth2

  - name: postgresql
    container:
      image: registry.redhat.io/rhel9/postgresql-15:latest
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      cpuLimit: 500m
      cpuRequest: 100m
      mountSources: true
      volumeMounts:
        - name: postgresql-data
          path: /var/lib/pgsql/data
      endpoints:
        - name: postgresql
          targetPort: 5432
          exposure: internal
      env:
        - name: POSTGRESQL_USER
          value: mammoth
        - name: POSTGRESQL_PASSWORD
          value: mammoth
        - name: POSTGRESQL_DATABASE
          value: mammothdb

  - name: postgresql-data
    volume:
      size: 1Gi

  - name: m2
    volume:
      size: 2Gi

commands:
  - id: setup-ide
    exec:
      component: tools
      commandLine: >-
        mkdir -p /tmp/extensions &&
        curl -sL -o /tmp/extensions/redhat.mta-vscode-extension.vsix.gz
        https://open-vsx.org/api/redhat/mta-vscode-extension/8.2.0/file/redhat.mta-vscode-extension-8.2.0.vsix &&
        gunzip -f /tmp/extensions/redhat.mta-vscode-extension.vsix.gz 2>/dev/null;
        mkdir -p /checode/remote/data/User/globalStorage/redhat.mta-core/settings &&
        cp ${PROJECT_SOURCE}/.vscode/mta-core/settings/provider-settings.yaml
        /checode/remote/data/User/globalStorage/redhat.mta-core/settings/provider-settings.yaml;
        mkdir -p /checode/remote/data/Machine &&
        echo '{"java.server.launchMode":"Standard","java.configuration.updateBuildConfiguration":"automatic","mta-core.genai.agentMode":true}' > /checode/remote/data/Machine/settings.json;
        true
      label: 'Set up IDE'

  - id: init-db
    exec:
      component: postgresql
      commandLine: >-
        for i in $(seq 1 30); do
        pg_isready -U mammoth -d mammothdb -q && break;
        echo "Waiting for PostgreSQL to be ready... ($i/30)";
        sleep 2;
        done &&
        psql -U mammoth -d mammothdb -f ${PROJECT_SOURCE}/init-db.sql
      workingDir: ${PROJECT_SOURCE}
      label: 'Initialize database'

  - id: build
    exec:
      component: tools
      commandLine: mvn clean install -DskipTests
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
      label: 'Build application'

  - id: test
    exec:
      component: tools
      commandLine: mvn clean verify
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
      label: 'Test application'

  - id: init-eap
    exec:
      component: eap
      commandLine: |
        export HOSTNAME=mammoth2 &&
        EAP_HOME=${JBOSS_HOME:-/opt/server} &&
        if [ ! -f "${EAP_HOME}/bin/standalone.sh" ]; then
          echo "Provisioning EAP 8 server via Galleon (this may take a few minutes)..." &&
          mkdir -p /tmp/eap8-provision &&
          cat > /tmp/eap8-provision/pom.xml << 'POMEOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <project>
          <modelVersion>4.0.0</modelVersion>
          <groupId>provision</groupId>
          <artifactId>eap8</artifactId>
          <version>1.0</version>
          <packaging>pom</packaging>
          <repositories>
            <repository><id>redhat-ga</id><url>https://maven.repository.redhat.com/ga/</url></repository>
            <repository><id>jboss-public</id><url>https://repository.jboss.org/nexus/content/groups/public/</url></repository>
          </repositories>
          <pluginRepositories>
            <pluginRepository><id>redhat-ga</id><url>https://maven.repository.redhat.com/ga/</url></pluginRepository>
            <pluginRepository><id>jboss-public</id><url>https://repository.jboss.org/nexus/content/groups/public/</url></pluginRepository>
          </pluginRepositories>
          <build>
            <plugins>
              <plugin>
                <groupId>org.wildfly.plugins</groupId>
                <artifactId>wildfly-maven-plugin</artifactId>
                <version>5.0.1.Final</version>
                <configuration>
                  <channels>
                    <channel>
                      <manifest>
                        <groupId>org.jboss.eap.channels</groupId>
                        <artifactId>eap-8.0</artifactId>
                      </manifest>
                    </channel>
                  </channels>
                  <feature-packs>
                    <feature-pack>
                      <location>org.jboss.eap:wildfly-ee-galleon-pack</location>
                    </feature-pack>
                  </feature-packs>
                  <layers>
                    <layer>cloud-server</layer>
                    <layer>ejb</layer>
                    <layer>jsf</layer>
                  </layers>
                  <provisioningDir>/opt/server</provisioningDir>
                </configuration>
              </plugin>
            </plugins>
          </build>
        </project>
        POMEOF
          mvn -f /tmp/eap8-provision/pom.xml wildfly:provision &&
          echo "EAP 8 provisioned at ${EAP_HOME}";
          if [ ! -f "${EAP_HOME}/bin/standalone.sh" ]; then
            echo "ERROR: Provisioning failed."; exit 1;
          fi;
        fi &&
        mkdir -p ${EAP_HOME}/modules/org/postgresql/main &&
        curl -sL -o ${EAP_HOME}/modules/org/postgresql/main/postgresql-jdbc.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar &&
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<module xmlns="urn:jboss:module:1.3" name="org.postgresql">\n  <resources>\n    <resource-root path="postgresql-jdbc.jar"/>\n  </resources>\n  <dependencies>\n    <module name="java.sql"/>\n    <module name="jakarta.transaction.api"/>\n  </dependencies>\n</module>\n' > ${EAP_HOME}/modules/org/postgresql/main/module.xml &&
        printf 'embed-server --server-config=standalone.xml\n/subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql, driver-module-name=org.postgresql, driver-xa-datasource-class-name=org.postgresql.xa.PGXADataSource)\ndata-source add --name=MammothDS --jndi-name=java:jboss/datasources/MammothDS --driver-name=postgresql --connection-url=jdbc:postgresql://localhost:5432/mammothdb --user-name=mammoth --password=mammoth --use-java-context=true --jta=true --min-pool-size=5 --max-pool-size=20 --enabled=true\nstop-embedded-server\n' > /tmp/configure-eap8.cli &&
        ${EAP_HOME}/bin/jboss-cli.sh --file=/tmp/configure-eap8.cli &&
        echo "EAP 8 configured" &&
        mkdir -p /tmp/eap8-tmp &&
        nohup ${EAP_HOME}/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0 -Djboss.http.port=8180 -Djboss.management.http.port=10190 -Djboss.server.temp.dir=/tmp/eap8-tmp > /tmp/eap8.log 2>&1 &
        echo "Waiting for EAP 8 to start..." &&
        for i in $(seq 1 60); do
          if ${EAP_HOME}/bin/jboss-cli.sh --connect --controller=localhost:10190 --command=":read-attribute(name=server-state)" 2>/dev/null | grep -q running; then
            echo "EAP 8 is running";
            break;
          fi;
          sleep 3;
        done &&
        echo "EAP 8 initialized with PostgreSQL datasource"
      label: 'Start EAP'

events:
  postStart:
    - setup-ide
    - init-db