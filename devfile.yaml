schemaVersion: 2.2.0
metadata:
  name: mammoth-ear
  version: 1.0.0
  description: Java EE 8 mammoth facts application with PostgreSQL backend and JSF frontend
attributes:
  .vscode/extensions.json: |
    {
      "recommendations": [
        "redhat.mta-vscode-extension"
      ]
    }
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: 500m
      mountSources: true
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      env:
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-11-openjdk

  - name: eap
    container:
      image: registry.redhat.io/jboss-eap-7/eap74-openjdk11-openshift-rhel8:latest
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
      endpoints:
        - name: eap-http
          targetPort: 8180
          exposure: public
          protocol: http
        - name: eap-admin
          targetPort: 10090
          exposure: internal
      env:
        - name: MAMMOTH_API_URL
          value: http://localhost:8180/backend/api/mammoths
        - name: JBOSS_NODE_NAME
          value: mammoth1

  - name: postgresql
    container:
      image: registry.redhat.io/rhel9/postgresql-15:latest
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      cpuLimit: 500m
      cpuRequest: 100m
      mountSources: true
      volumeMounts:
        - name: postgresql-data
          path: /var/lib/pgsql/data
      endpoints:
        - name: postgresql
          targetPort: 5432
          exposure: internal
      env:
        - name: POSTGRESQL_USER
          value: mammoth
        - name: POSTGRESQL_PASSWORD
          value: mammoth
        - name: POSTGRESQL_DATABASE
          value: mammothdb

  - name: postgresql-data
    volume:
      size: 1Gi

  - name: m2
    volume:
      size: 2Gi

commands:
  - id: init-db
    exec:
      component: postgresql
      commandLine: >-
        for i in $(seq 1 30); do
        pg_isready -U mammoth -d mammothdb -q && break;
        echo "Waiting for PostgreSQL to be ready... ($i/30)";
        sleep 2;
        done &&
        psql -U mammoth -d mammothdb -f ${PROJECT_SOURCE}/init-db.sql
      workingDir: ${PROJECT_SOURCE}
      label: 'Initialize database with mammoth facts'

  - id: build
    exec:
      component: tools
      commandLine: mvn clean install -DskipTests
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
      label: 'Build the EAR application'

  - id: test
    exec:
      component: tools
      commandLine: mvn clean verify
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
      label: 'Run unit and integration tests'

  - id: init-eap
    exec:
      component: eap
      commandLine: |
        export HOSTNAME=mammoth1 &&
        if grep -q messaging-activemq ${JBOSS_HOME}/standalone/configuration/standalone-openshift.xml; then
          ${JBOSS_HOME}/bin/jboss-cli.sh --commands="embed-server --server-config=standalone-openshift.xml,/subsystem=messaging-activemq:remove,/socket-binding-group=standard-sockets/socket-binding=messaging:remove,/socket-binding-group=standard-sockets/socket-binding=messaging-throughput:remove,/extension=org.wildfly.extension.messaging-activemq:remove,stop-embedded-server"
        fi &&
        mkdir -p /tmp/eap-tmp &&
        nohup ${JBOSS_HOME}/bin/standalone.sh -c standalone-openshift.xml -b 0.0.0.0 -bmanagement 0.0.0.0 -Djboss.http.port=8180 -Djboss.management.http.port=10090 -Djboss.server.temp.dir=/tmp/eap-tmp > /tmp/eap.log 2>&1 &
        echo "Waiting for EAP to start..." &&
        for i in $(seq 1 60); do
          if ${JBOSS_HOME}/bin/jboss-cli.sh --connect --controller=localhost:10090 --command=":read-attribute(name=server-state)" 2>/dev/null | grep -q running; then
            echo "EAP is running";
            break;
          fi;
          sleep 3;
        done &&
        mkdir -p ${JBOSS_HOME}/modules/org/postgresql/main &&
        curl -sL -o ${JBOSS_HOME}/modules/org/postgresql/main/postgresql-jdbc.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar &&
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<module xmlns="urn:jboss:module:1.3" name="org.postgresql">\n  <resources>\n    <resource-root path="postgresql-jdbc.jar"/>\n  </resources>\n  <dependencies>\n    <module name="javax.api"/>\n    <module name="javax.transaction.api"/>\n  </dependencies>\n</module>\n' > ${JBOSS_HOME}/modules/org/postgresql/main/module.xml &&
        ${JBOSS_HOME}/bin/jboss-cli.sh --connect --controller=localhost:10090 --commands="/subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql,driver-module-name=org.postgresql,driver-xa-datasource-class-name=org.postgresql.xa.PGXADataSource),data-source add --name=MammothDS --jndi-name=java:jboss/datasources/MammothDS --driver-name=postgresql --connection-url=jdbc:postgresql://localhost:5432/mammothdb --user-name=mammoth --password=mammoth --use-java-context=true --jta=true --min-pool-size=5 --max-pool-size=20 --enabled=true" &&
        echo "EAP initialized with PostgreSQL datasource"
      label: 'Start EAP, install PostgreSQL driver, and configure datasource'

  - id: start-eap
    exec:
      component: eap
      commandLine: >-
        export HOSTNAME=mammoth1 &&
        mkdir -p /tmp/eap-tmp &&
        ${JBOSS_HOME}/bin/standalone.sh -c standalone-openshift.xml -b 0.0.0.0 -bmanagement 0.0.0.0 -Djboss.http.port=8180 -Djboss.management.http.port=10090 -Djboss.server.temp.dir=/tmp/eap-tmp
      label: 'Start JBoss EAP server (foreground)'

  - id: stop-eap
    exec:
      component: eap
      commandLine: >-
        ${JBOSS_HOME}/bin/jboss-cli.sh --connect --controller=localhost:10090 --command=shutdown
      label: 'Stop JBoss EAP server'

  - id: deploy
    exec:
      component: eap
      commandLine: >-
        cp ${PROJECT_SOURCE}/ear/target/mammoth-ear.ear ${JBOSS_HOME}/standalone/deployments/
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
      label: 'Deploy EAR to JBoss EAP'

  - id: undeploy
    exec:
      component: eap
      commandLine: >-
        rm -f ${JBOSS_HOME}/standalone/deployments/mammoth-ear.ear
      label: 'Undeploy EAR from JBoss EAP'

events:
  postStart:
    - init-db
